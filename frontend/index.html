<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="description" content="Hikma Business OS — responsive offline-first business management frontend">
<link rel="manifest" href="manifest.json"><title>Hikma Business OS</title>
<style>
:root{--bg:#07101d;--panel:#0d1828;--panel2:#111f32;--text:#eef5ff;--muted:#91a2b8;--line:#203148;--brand:#5eead4;--brand2:#60a5fa;--danger:#fb7185;--warn:#fbbf24;--ok:#34d399;--shadow:0 12px 35px #0005}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07101d,#0b1422);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#091321;border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0;z-index:20}.logo{font-size:22px;font-weight:800;padding:10px 12px 22px}.logo span{color:var(--brand)}.nav{display:grid;gap:6px}.nav button{width:100%;text-align:left;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}.main{margin-left:250px;width:calc(100% - 250px);padding:18px;min-width:0}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.top h1{margin:0;font-size:25px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:9px 13px;border-radius:9px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.primary{background:var(--brand);color:#04211e;border-color:transparent;font-weight:700}.btn.danger{color:#fff;background:#7f1d1d}.status{font-size:12px;color:var(--muted)}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(145deg,var(--panel),#0b1625);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.metric{font-size:25px;font-weight:800;margin-top:7px}.label{color:var(--muted);font-size:12px}.delta{font-size:12px;margin-top:8px}.positive{color:var(--ok)}.negative{color:var(--danger)}.content{display:none}.content.active{display:block}.two{grid-template-columns:1.45fr .85fr}.three{grid-template-columns:repeat(3,1fr)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.table th{color:var(--muted);font-size:12px}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#17304b;color:#b9d8ff;font-size:11px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field{background:#081321;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px;width:100%}.toolbar .field{width:auto;min-width:160px}.chart{height:280px;display:flex;align-items:end;gap:7px;padding:20px 5px 8px;border-top:1px solid var(--line)}.bar{flex:1;min-width:4px;background:linear-gradient(to top,var(--brand2),var(--brand));border-radius:5px 5px 0 0;position:relative}.bar small{position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:var(--muted);font-size:9px}.bar-label{font-size:9px;color:var(--muted);writing-mode:vertical-rl;transform:rotate(180deg);margin-left:2px}.list{display:grid;gap:9px}.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.modal-box{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.form{display:grid;gap:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fab{display:none}.mobile-nav{display:none}.toast{position:fixed;right:18px;bottom:18px;background:#10243a;border:1px solid var(--line);padding:12px 15px;border-radius:10px;z-index:80;box-shadow:var(--shadow)}.empty{padding:30px;text-align:center;color:var(--muted)}.report{line-height:1.65}.report h3{margin-bottom:5px}.offline{color:var(--warn)}.online{color:var(--ok)}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.main{margin-left:0;width:100%;padding-bottom:75px}.fab{display:block;position:fixed;left:14px;top:13px;z-index:30}.top{padding-left:45px}.mobile-nav{display:grid;position:fixed;bottom:0;left:0;right:0;z-index:25;grid-template-columns:repeat(5,1fr);background:#091321;border-top:1px solid var(--line)}.mobile-nav button{padding:9px 2px;background:transparent;color:var(--muted);font-size:10px}.mobile-nav button.active{color:var(--brand)}}
@media(max-width:560px){.cards{grid-template-columns:1fr 1fr}.metric{font-size:20px}.form-grid{grid-template-columns:1fr}.toolbar .field{min-width:120px;width:100%}.top h1{font-size:20px}}
</style></head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="logo">Hikma <span>Pro</span></div><nav class="nav" id="nav">
<button data-page="dashboard">⌂ Dashboard</button><button data-page="sales">▣ Sales</button><button data-page="inventory">▤ Inventory</button><button data-page="purchases">⇩ Purchases</button><button data-page="customers">♙ CRM / Customers</button><button data-page="employees">♟ Employees</button><button data-page="expenses">− Expenses</button><button data-page="invoices">▧ Invoices</button><button data-page="reports">◫ Analysis & Reports</button><button data-page="scan">⌁ Scan / QR</button><button data-page="settings">⚙ Settings</button></nav></aside>
<main class="main"><button class="btn fab" onclick="toggleSidebar()">☰</button><header class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="status">Hikma Business OS · <span id="net" class="online">Online</span> · <span id="sync">Local data ready</span></div></div><div class="actions"><button class="btn" onclick="exportJSON()">Backup</button><button class="btn primary" onclick="openSale()">+ New Sale</button></div></header>
<section id="dashboard" class="content active"></section><section id="sales" class="content"></section><section id="inventory" class="content"></section><section id="purchases" class="content"></section><section id="customers" class="content"></section><section id="employees" class="content"></section><section id="expenses" class="content"></section><section id="invoices" class="content"></section><section id="reports" class="content"></section><section id="scan" class="content"></section><section id="settings" class="content"></section>
</main></div><nav class="mobile-nav" id="mobileNav"><button data-page="dashboard">⌂<br>Home</button><button data-page="sales">▣<br>Sales</button><button data-page="inventory">▤<br>Stock</button><button data-page="customers">♙<br>CRM</button><button data-page="reports">◫<br>Reports</button></nav>
<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><div id="toast" style="display:none" class="toast"></div>
<script>
const API_BASE_URL=localStorage.getItem('hikma_api')||'https://hikma-business-os-api.onrender.com';
const KEY='hikma_business_os_v1';
const seed={products:[{id:'p1',name:'Sample Product',sku:'SKU-001',category:'General',price:100,cost:60,stock:25,reorder:5}],sales:[],customers:[],purchases:[],employees:[],expenses:[],invoices:[]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;let current='dashboard';
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('sync').textContent='Saved offline';}
function money(n){return 'KSh '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function nav(page){current=page;document.querySelectorAll('.content').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageTitle').textContent=page==='reports'?'Analysis & Reports':page==='customers'?'CRM / Customers':page[0].toUpperCase()+page.slice(1);render();document.getElementById('sidebar').classList.remove('open')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function stats(){let sales=db.sales.reduce((a,x)=>a+x.total,0),cost=db.sales.reduce((a,x)=>a+(x.cost||0),0),today=new Date().toISOString().slice(0,10),todaySales=db.sales.filter(x=>x.date?.startsWith(today)).reduce((a,x)=>a+x.total,0);return {sales,cost,profit:sales-cost,today:todaySales,stock:db.products.reduce((a,x)=>a+Number(x.stock||0),0)}}
function dashboard(){let s=stats(), low=db.products.filter(p=>p.stock<=p.reorder);let best=[...db.products].map(p=>({p,n:db.sales.reduce((a,x)=>a+(x.items||[]).filter(i=>i.productId===p.id).reduce((z,i)=>z+i.qty,0),0)})).sort((a,b)=>b.n-a.n).slice(0,5);return `<div class="grid cards"><div class="card"><div class="label">Total Sales</div><div class="metric">${money(s.sales)}</div><div class="delta">All recorded sales</div></div><div class="card"><div class="label">Profit</div><div class="metric">${money(s.profit)}</div><div class="delta positive">Estimated gross profit</div></div><div class="card"><div class="label">Today</div><div class="metric">${money(s.today)}</div><div class="delta">Today's sales</div></div><div class="card"><div class="label">Stock Units</div><div class="metric">${s.stock}</div><div class="delta ${low.length?'negative':'positive'}">${low.length} low-stock items</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Sales performance</h3>${miniChart(14)}</div><div class="card"><h3>AI Insight</h3><div class="report">${insight()}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Best sellers</h3><div class="list">${best.map(x=>`<div class="list-row"><span>${esc(x.p.name)}</span><b>${x.n} units</b></div>`).join('')||'<div class="empty">No sales yet.</div>'}</div></div><div class="card"><h3>Low stock</h3><div class="list">${low.map(p=>`<div class="list-row"><span>${esc(p.name)}</span><b class="negative">${p.stock}</b></div>`).join('')||'<div class="empty">Everything is above reorder level.</div>'}</div></div></div>`}
function rows(arr,cols,empty='No records yet.'){if(!arr.length)return `<div class="empty">${empty}</div>`;return `<div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${arr.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sales(){return `<div class="toolbar"><input class="field" id="saleSearch" placeholder="Search sales" oninput="renderSales()"><button class="btn primary" onclick="openSale()">+ New Sale</button></div><div class="card" id="salesTable"></div>`}
function renderSales(){let q=(document.getElementById('saleSearch')?.value||'').toLowerCase();let a=db.sales.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('salesTable').innerHTML=rows(a.map(x=>[esc(x.id),esc(x.date?.slice(0,16)||''),money(x.total),esc(x.payment||'Cash'),`<span class="pill">${x.items?.length||0} items</span>`]),['Receipt','Date','Total','Payment','Items'])}
function inventory(){return `<div class="toolbar"><button class="btn primary" onclick="openProduct()">+ Add Product</button><button class="btn" onclick="openProduct(true)">+ Quick Stock</button></div><div class="card">${rows(db.products.map(p=>[esc(p.name),esc(p.sku),esc(p.category),money(p.price),p.stock,p.stock<=p.reorder?'<span class="pill">Reorder</span>':'<span class="pill">OK</span>',`<button class="btn" onclick="openProduct(false,'${p.id}')">Edit</button>`]),['Product','SKU','Category','Price','Stock','Status',''])}</div>`}
function simplePage(type,label,fields){let a=db[type];return `<div class="toolbar"><button class="btn primary" onclick="openGeneric('${type}','${label}')">+ Add ${label}</button></div><div class="card">${rows(a.map(x=>[esc(x.name||x.title||x.description||x.id),esc(x.phone||x.category||x.date||''),money(x.amount||x.total||x.balance||0),`<button class="btn" onclick="removeRecord('${type}','${x.id}')">Delete</button>`]),['Name / Item','Details','Amount',''])}</div>`}
function purchases(){return simplePage('purchases','Purchase')};function customers(){return simplePage('customers','Customer')};function employees(){return simplePage('employees','Employee')};function expenses(){return simplePage('expenses','Expense')};function invoices(){return simplePage('invoices','Invoice')}
function reports(){return `<div class="toolbar"><select class="field" id="period" onchange="renderReport()"><option value="7">7 days</option><option value="14">14 weeks</option><option value="30">1 month</option><option value="365">1 year</option></select><button class="btn" onclick="downloadReport()">Full Report</button></div><div id="reportArea"></div>`}
function miniChart(days){let data=series(days);let max=Math.max(1,...data.map(x=>x.v));return `<div class="chart">${data.map(x=>`<div style="flex:${Math.max(1,1/data.length)};display:flex;align-items:end;height:100%;gap:2px"><div class="bar" style="height:${Math.max(2,x.v/max*92)}%"><small>${x.v?Math.round(x.v):''}</small></div></div>`).join('')}</div>`}
function series(days){let out=[];for(let i=days-1;i>=0;i--){let d=new Date(Date.now()-i*86400000).toISOString().slice(0,10);out.push({d,v:db.sales.filter(x=>x.date?.startsWith(d)).reduce((a,x)=>a+x.total,0)})}if(days>31){let buckets=[];for(let i=0;i<days;i+=7){buckets.push({d:`W${Math.floor(i/7)+1}`,v:out.slice(i,i+7).reduce((a,x)=>a+x.v,0)})}return buckets.reverse()}return out}
function renderReport(){let n=Number(document.getElementById('period')?.value||7),data=series(n),s=stats();let best=[...db.products].map(p=>({name:p.name,qty:db.sales.reduce((a,x)=>a+(x.items||[]).filter(i=>i.productId===p.id).reduce((z,i)=>z+i.qty,0),0)})).sort((a,b)=>b.qty-a.qty).slice(0,5);document.getElementById('reportArea').innerHTML=`<div class="grid two"><div class="card"><h3>Sales trend</h3>${miniChart(n)}</div><div class="card"><h3>AI Insight</h3><div class="report">${insight()}</div></div></div><div class="grid three" style="margin-top:14px"><div class="card"><div class="label">Revenue</div><div class="metric">${money(s.sales)}</div></div><div class="card"><div class="label">Gross Profit</div><div class="metric">${money(s.profit)}</div></div><div class="card"><div class="label">Transactions</div><div class="metric">${db.sales.length}</div></div></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Best sales/products</h3>${rows(best.map(x=>[esc(x.name),x.qty+' units']),['Product','Units'])}</div><div class="card"><h3>Operational summary</h3><div class="report"><p>Products: <b>${db.products.length}</b></p><p>Customers: <b>${db.customers.length}</b></p><p>Employees: <b>${db.employees.length}</b></p><p>Low stock: <b>${db.products.filter(p=>p.stock<=p.reorder).length}</b></p><p>Expenses: <b>${money(db.expenses.reduce((a,x)=>a+Number(x.amount||0),0))}</b></p></div></div></div>`}
function insight(){let low=db.products.filter(p=>p.stock<=p.reorder), s=stats();if(!db.sales.length)return `<p>Start recording sales and Hikma will build performance signals from your local data.</p><p>Offline mode is active: records remain on this device until you sync them.</p>`;let top=[...db.products].map(p=>({p,n:db.sales.reduce((a,x)=>a+(x.items||[]).filter(i=>i.productId===p.id).reduce((z,i)=>z+i.qty,0),0)})).sort((a,b)=>b.n-a.n)[0];return `<ul><li>Revenue recorded: <b>${money(s.sales)}</b>.</li><li>Estimated gross profit: <b>${money(s.profit)}</b>.</li><li>Top product: <b>${esc(top?.p.name||'—')}</b>.</li><li>${low.length?`<b>${low.length}</b> product(s) need stock attention.`:'No products are below their reorder levels.'}</li><li>These insights are computed locally; connect an AI endpoint later for richer narrative analysis.</li></ul>`}
function scan(){return `<div class="grid two"><div class="card"><h3>Barcode / QR Scanner</h3><p class="status">Uses your device camera when the browser supports BarcodeDetector.</p><video id="video" playsinline style="width:100%;border-radius:12px;background:#000"></video><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="startScanner()">Start camera</button><button class="btn" onclick="stopScanner()">Stop</button></div><div id="scanResult" class="status">Ready.</div></div><div class="card"><h3>QR / barcode actions</h3><p>Scan a product code and search inventory. For maximum offline compatibility, you can also enter a SKU manually.</p><input class="field" id="manualSku" placeholder="Enter SKU"><button class="btn primary" style="margin-top:8px" onclick="lookupSku()">Find product</button><div id="skuResult" style="margin-top:12px"></div></div></div>`}
let stream=null,scanTimer=null;async function startScanner(){if(!('BarcodeDetector'in window)){toast('Camera barcode scanning is not supported in this browser.');return}try{let v=document.getElementById('video');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();let detector=new BarcodeDetector({formats:['qr_code','code_128','ean_13','ean_8','upc_a']});scanTimer=setInterval(async()=>{try{let c=await detector.detect(v);if(c[0]){let val=c[0].rawValue;document.getElementById('scanResult').textContent='Found: '+val;document.getElementById('manualSku').value=val;lookupSku();stopScanner()}}catch(e){}},400)}catch(e){toast('Camera permission was not granted.')}}function stopScanner(){if(scanTimer)clearInterval(scanTimer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}function lookupSku(){let q=document.getElementById('manualSku').value.trim().toLowerCase(),p=db.products.find(x=>x.sku?.toLowerCase()===q||x.name.toLowerCase()===q);document.getElementById('skuResult').innerHTML=p?`<div class="card"><b>${esc(p.name)}</b><p>SKU: ${esc(p.sku)} · Stock: ${p.stock} · Price: ${money(p.price)}</p></div>`:'<span class="negative">No matching product.</span>'}
function settings(){return `<div class="card"><h3>Hikma configuration</h3><div class="form"><label>API base URL<input class="field" id="apiUrl" value="${esc(API_BASE_URL)}"></label><div class="actions"><button class="btn primary" onclick="saveApi()">Save API URL</button><button class="btn" onclick="syncNow()">Sync now</button><button class="btn danger" onclick="resetData()">Reset local data</button></div><p class="status">The frontend is offline-first. Local records are available without internet. Server sync requires a compatible Hikma API.</p></div></div>`}
function saveApi(){localStorage.setItem('hikma_api',document.getElementById('apiUrl').value.trim());toast('API URL saved.');}
async function syncNow(){try{let r=await fetch(API_BASE_URL+'/api/health');if(!r.ok)throw 0;document.getElementById('sync').textContent='Server reachable';toast('Server reachable.')}catch(e){toast('Server unavailable; staying offline.')}}
function openSale(){modal(`<h3>New Sale</h3><form class="form" onsubmit="createSale(event)"><select class="field" id="sp">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} — stock ${p.stock}</option>`).join('')}</select><input class="field" id="sq" type="number" min="1" value="1" placeholder="Quantity"><select class="field" id="pay"><option>Cash</option><option>M-Pesa</option><option>Airtel Money</option><option>Card</option><option>Credit</option></select><div class="actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save Sale</button></div></form>`)}
function createSale(e){e.preventDefault();let p=db.products.find(x=>x.id===document.getElementById('sp').value),q=Number(document.getElementById('sq').value);if(!p||q<1||q>p.stock)return toast('Check product and quantity.');let total=q*p.price;db.sales.push({id:id('sale_'),date:new Date().toISOString(),total,cost:q*p.cost,payment:document.getElementById('pay').value,items:[{productId:p.id,qty:q,price:p.price}]});p.stock-=q;save();closeModal();render();toast('Sale recorded offline.');}
function openProduct(edit=false,pid){let p=pid?db.products.find(x=>x.id===pid):null;modal(`<h3>${p?'Edit':'Add'} Product</h3><form class="form" onsubmit="saveProduct(event,'${pid||''}')"><input class="field" id="pn" value="${esc(p?.name||'')}" placeholder="Product name" required><input class="field" id="ps" value="${esc(p?.sku||'')}" placeholder="SKU / barcode" required><input class="field" id="pc" value="${esc(p?.category||'General')}" placeholder="Category"><div class="form-grid"><input class="field" id="pp" type="number" step=".01" value="${p?.price||0}" placeholder="Selling price"><input class="field" id="pco" type="number" step=".01" value="${p?.cost||0}" placeholder="Cost"></div><div class="form-grid"><input class="field" id="pst" type="number" value="${p?.stock||0}" placeholder="Stock"><input class="field" id="pr" type="number" value="${p?.reorder||5}" placeholder="Reorder level"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Product</button></div></form>`)}
function saveProduct(e,pid){e.preventDefault();let x={id:pid||id('p_'),name:document.getElementById('pn').value.trim(),sku:document.getElementById('ps').value.trim(),category:document.getElementById('pc').value.trim(),price:Number(document.getElementById('pp').value),cost:Number(document.getElementById('pco').value),stock:Number(document.getElementById('pst').value),reorder:Number(document.getElementById('pr').value)};let i=db.products.findIndex(p=>p.id===x.id);if(i>=0)db.products[i]=x;else db.products.push(x);save();closeModal();render();toast('Product saved.');}
function openGeneric(type,label){modal(`<h3>New ${label}</h3><form class="form" onsubmit="createGeneric(event,'${type}')"><input class="field" id="gn" placeholder="Name / description" required><input class="field" id="gp" placeholder="Phone / category / date"><input class="field" id="ga" type="number" step=".01" placeholder="Amount / balance"><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`)}function createGeneric(e,type){e.preventDefault();db[type].push({id:id(type+'_'),name:document.getElementById('gn').value.trim(),phone:document.getElementById('gp').value.trim(),amount:Number(document.getElementById('ga').value)||0,date:new Date().toISOString()});save();closeModal();render();toast('Saved offline.')}function removeRecord(type,rid){if(confirm('Delete this record?')){db[type]=db[type].filter(x=>x.id!==rid);save();render();toast('Deleted.')}}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function exportJSON(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hikma-business-os-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}function resetData(){if(confirm('Reset all local Hikma data? This cannot be undone.')){db=structuredClone(seed);save();render();toast('Local data reset.')}}
function downloadReport(){let s=stats(),text=`HIKMA BUSINESS OS REPORT\nGenerated: ${new Date().toLocaleString()}\nRevenue: ${money(s.sales)}\nGross profit: ${money(s.profit)}\nTransactions: ${db.sales.length}\nProducts: ${db.products.length}\nCustomers: ${db.customers.length}\nLow stock: ${db.products.filter(p=>p.stock<=p.reorder).length}\n\nAI INSIGHT\n${document.querySelector('#reports .report')?.innerText||insight()}`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='hikma-business-report.txt';a.click();}
function render(){if(current==='dashboard')document.getElementById('dashboard').innerHTML=dashboard();if(current==='sales'){document.getElementById('sales').innerHTML=sales();renderSales()}if(current==='inventory')document.getElementById('inventory').innerHTML=inventory();if(current==='purchases')document.getElementById('purchases').innerHTML=purchases();if(current==='customers')document.getElementById('customers').innerHTML=customers();if(current==='employees')document.getElementById('employees').innerHTML=employees();if(current==='expenses')document.getElementById('expenses').innerHTML=expenses();if(current==='invoices')document.getElementById('invoices').innerHTML=invoices();if(current==='reports'){document.getElementById('reports').innerHTML=reports();renderReport()}if(current==='scan')document.getElementById('scan').innerHTML=scan();if(current==='settings')document.getElementById('settings').innerHTML=settings()}
window.addEventListener('online',()=>{document.getElementById('net').textContent='Online';document.getElementById('net').className='online'});window.addEventListener('offline',()=>{document.getElementById('net').textContent='Offline';document.getElementById('net').className='offline'});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
